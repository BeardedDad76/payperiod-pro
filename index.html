let _auth = null, _db = null, _fbReady = false;

function loadScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)){res();return;}
    const s=document.createElement("script");
    s.src=src;s.onload=res;s.onerror=rej;
    document.head.appendChild(s);
  });
}

async function initFirebase(){
  if(_fbReady) return;
  await loadScript("https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js");
  await loadScript("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js");
  await loadScript("https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js");
  if(!window.firebase.apps.length) window.firebase.initializeApp(FB_CONFIG);
  _auth = window.firebase.auth();
  _db   = window.firebase.database();
  _fbReady = true;
}

async function fbSave(uid,data){
  if(!_db) return false;
  try{ await _db.ref("users/"+uid+"/tracker").set(data); return true; }catch{ return false; }
}
async function fbLoad(uid){
  if(!_db) return null;
  try{ const s=await _db.ref("users/"+uid+"/tracker").get(); return s.exists()?s.val():null; }catch{ return null; }
}

// ── AUTH SCREEN ───────────────────────────────────────────────────────────────
function AuthScreen({mode,onToggle,onSuccess,onBack}){
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [name,setName]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const isSignUp=mode==="signup";

  const handle=async()=>{
    setErr("");setLoading(true);
    try{
      await initFirebase();
      if(isSignUp){
        const c=await _auth.createUserWithEmailAndPassword(email,pass);
        await c.user.updateProfile({displayName:name});
      } else {
        await _auth.signInWithEmailAndPassword(email,pass);
      }
      onSuccess();
    }catch(e){setErr(e.message.replace("Firebase: ","").replace(/\(auth.*\)/,""));}
    setLoading(false);
  };

  const handleGoogle=async()=>{
    setErr("");setLoading(true);
    try{
      await initFirebase();
      const gp=new window.firebase.auth.GoogleAuthProvider();
      await _auth.signInWithPopup(gp);
      onSuccess();
    }catch(e){setErr(e.message.replace("Firebase: ","").replace(/\(auth.*\)/,""));}
    setLoading(false);
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24,background:"#0a0d14",fontFamily:"'Inter','Segoe UI',sans-serif"}}>
      <div style={{background:"#13161f",border:"1px solid #1e2230",borderRadius:16,padding:"40px 36px",width:"100%",maxWidth:420}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:22,fontWeight:900,background:"linear-gradient(135deg,#6366f1,#818cf8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",letterSpacing:"-0.5px",marginBottom:4}}>PayPeriod Pro</div>
          <div style={{fontSize:11,color:"#4b5563",textTransform:"uppercase",letterSpacing:2}}>Bills tracker for every paycheck</div>
        </div>
        <h2 style={{fontSize:22,fontWeight:800,color:"#f0f2f8",marginBottom:6}}>{isSignUp?"Create your account":"Welcome back"}</h2>
        <p style={{fontSize:13,color:"#6b7280",marginBottom:24}}>{isSignUp?"Get full access free for 30 days. No credit card required.":"Sign in to access your bills tracker."}</p>
        {err&&<div style={{background:"#3b1500",border:"1px solid #92400e",borderRadius:8,padding:"10px 14px",fontSize:13,color:"#fcd34d",marginBottom:16}}>{err}</div>}
        {isSignUp&&<div style={{marginBottom:14}}>
          <label style={S.lbl}>Your name</label>
          <input style={{...S.inp,borderRadius:8,padding:"11px 14px"}} type="text" placeholder="First name" value={name} onChange={e=>setName(e.target.value)}/>
        </div>}
        <div style={{marginBottom:14}}>
          <label style={S.lbl}>Email address</label>
          <input style={{...S.inp,borderRadius:8,padding:"11px 14px"}} type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)}/>
        </div>
        <div style={{marginBottom:16}}>
          <label style={S.lbl}>Password</label>
          <input style={{...S.inp,borderRadius:8,padding:"11px 14px"}} type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handle()}/>
        </div>
        <button onClick={handle} disabled={loading} style={{width:"100%",padding:13,background:"linear-gradient(135deg,#6366f1,#4f46e5)",color:"#fff",border:"none",borderRadius:9,fontWeight:700,fontSize:15,cursor:loading?"default":"pointer",marginBottom:14}}>
          {loading?"Please wait…":isSignUp?"Create Account":"Sign In"}
        </button>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14,color:"#374151",fontSize:12}}>
          <div style={{flex:1,height:1,background:"#1e2230"}}/>or<div style={{flex:1,height:1,background:"#1e2230"}}/>
        </div>
        <button onClick={handleGoogle} disabled={loading} style={{width:"100%",padding:12,background:"#1a1f2e",color:"#e8eaf0",border:"1px solid #2a2f3e",borderRadius:9,fontWeight:600,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:10,cursor:"pointer",marginBottom:20}}>
          <svg width={18} height={18} viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          {isSignUp?"Sign up with Google":"Continue with Google"}
        </button>
        <div style={{textAlign:"center",fontSize:13,color:"#6b7280"}}>
          {isSignUp?"Already have an account? ":"Don't have an account? "}
          <button onClick={onToggle} style={{color:"#818cf8",background:"none",border:"none",fontWeight:600,cursor:"pointer"}}>{isSignUp?"Sign in":"Start free trial"}</button>
        </div>
        <div style={{textAlign:"center",marginTop:12}}>
          <button onClick={onBack} style={{color:"#4b5563",background:"none",border:"none",fontSize:12,cursor:"pointer"}}>← Back to home</button>
        </div>
      </div>
    </div>
  );
}

          <div>{bill.dueDay}</div>
        </button>
        {showDP&&<div style={{position:"absolute",top:36,left:0,zIndex:100,background:"#1a1f2e",border:"1px solid "+accent,borderRadius:10,padding:10,width:200,boxShadow:"0 8px 32px rgba(0,0,0,0.6)"}}>
          <div style={{fontSize:10,color:"#8b92a5",textTransform:"uppercase",letterSpacing:1,marginBottom:8,fontWeight:600}}>Select Due Day</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
            {Array.from({length:31},(_,i)=>i+1).map(d=><button key={d} onClick={()=>{onDayChange(d);setShowDP(false);}} style={{padding:"5px 2px",borderRadius:5,border:"none",fontSize:12,fontWeight:d===bill.dueDay?800:400,background:d===bill.dueDay?accent:"#2a2f3e",color:d===bill.dueDay?"#fff":"#9ca3af",cursor:"pointer"}}>{d}</button>)}
          </div>
          <button onClick={()=>setShowDP(false)} style={{marginTop:8,width:"100%",background:"none",border:"none",color:"#8b92a5",fontSize:11,cursor:"pointer"}}>Cancel</button>
        </div>}
      </div>
      <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>{if(!editing){setShowDP(false);setEditingId(bill.id);}}}>
        <div style={{fontWeight:600,fontSize:13,color:bill.paid?"#6b7280":"#e8eaf0",textDecoration:bill.paid?"line-through":"none",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{bill.name}</div>
        <div style={{display:"flex",gap:5,marginTop:2}}>
          {bill.autopay&&<span style={{fontSize:10,color:accent}}>● Auto</span>}
          {bill.lateFee&&!bill.autopay&&<span style={{fontSize:10,color:"#f59e0b"}}>⚠ Late Fee</span>}
        </div>
      </div>
      {editing
        ?<input autoFocus type="number" step="0.01" value={bill.amount} onChange={e=>onAmt(e.target.value)} onBlur={()=>setEditingId(null)} onKeyDown={e=>{if(e.key==="Enter")setEditingId(null);}} style={{width:100,background:"#0f1117",border:"1px solid "+accent,borderRadius:6,color:"#fff",padding:"6px 8px",fontSize:14,textAlign:"right"}}/>
        :<button onClick={()=>{setShowDP(false);setEditingId(bill.id);}} style={{background:"#0f1117",border:"1px solid #2a2f3e",flexShrink:0,color:amt>0?"#f0f2f8":"#6b7280",fontSize:13,fontWeight:700,fontFamily:"inherit",padding:"5px 9px",borderRadius:6,minWidth:80,textAlign:"right",cursor:"pointer"}}>{amt>0?fmt(amt):"$ —"}</button>
      }
    </div>
  );
}

function ResetButton({onConfirm,label,accent,dark}){
  const [conf,setConf]=useState(false);
  if(conf)return <div style={{display:"flex",gap:8}}>
    <button onClick={()=>{onConfirm();setConf(false);}} style={{flex:1,padding:"11px",background:`linear-gradient(135deg,${accent},${dark})`,color:"#fff",border:"none",borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer"}}>✓ Yes, Start Next Cycle</button>
    <button onClick={()=>setConf(false)} style={{padding:"11px 16px",background:"#2a2f3e",color:"#9ca3af",border:"none",borderRadius:8,fontWeight:600,fontSize:13,cursor:"pointer"}}>Cancel</button>
  </div>;
  return <button onClick={()=>setConf(true)} style={{width:"100%",padding:"11px",background:"transparent",color:accent,border:`1px solid ${accent}`,borderRadius:8,fontWeight:700,fontSize:13,cursor:"pointer"}}>Reset {label} for Next Cycle →</button>;
}

function ManageBills({bills,onToggle,onDelete,onAdd,newBill,setNewBill,showAdd,setShowAdd,accent,periodLabel}){
  const [conf,setConf]=useState(null);
  return (
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <span style={{fontSize:12,color:"#6b7280"}}>Bills for {periodLabel}</span>
        <button onClick={()=>setShowAdd(!showAdd)} style={{background:accent,border:"none",color:"#fff",borderRadius:7,padding:"6px 13px",fontSize:12,fontWeight:600,cursor:"pointer"}}>+ Add Bill</button>
      </div>
      {showAdd&&<div style={{background:"#1a1f2e",border:`1px solid ${accent}`,borderRadius:10,padding:12,marginBottom:12}}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 68px 95px",gap:8,marginBottom:8}}>
          <div><label style={S.lbl}>Name</label><input value={newBill.name} onChange={e=>setNewBill({...newBill,name:e.target.value})} style={S.inp} placeholder="Bill name"/></div>
          <div><label style={S.lbl}>Due Day</label><input type="number" value={newBill.dueDay} onChange={e=>setNewBill({...newBill,dueDay:e.target.value})} style={S.inp} placeholder="1"/></div>
          <div><label style={S.lbl}>Amount</label><input type="number" step="0.01" value={newBill.amount} onChange={e=>setNewBill({...newBill,amount:e.target.value})} style={S.inp} placeholder="0.00"/></div>
        </div>
        <div style={{display:"flex",gap:14,marginBottom:10,fontSize:13}}>
          <label style={{display:"flex",gap:6,alignItems:"center",color:"#9ca3af",cursor:"pointer"}}><input type="checkbox" checked={newBill.autopay} onChange={e=>setNewBill({...newBill,autopay:e.target.checked})}/> This bill is set up for autopay</label>
          <label style={{display:"flex",gap:6,alignItems:"center",color:"#9ca3af",cursor:"pointer"}}><input type="checkbox" checked={newBill.lateFee} onChange={e=>setNewBill({...newBill,lateFee:e.target.checked})}/> This bill has late fees if missed</label>
        </div>
        <button onClick={onAdd} style={{background:"#22c55e",border:"none",color:"#fff",borderRadius:7,padding:"7px 15px",fontWeight:600,cursor:"pointer",fontSize:13}}>Add Bill</button>
      </div>}
      {bills.length===0&&<div style={{textAlign:"center",padding:"40px 20px",color:"#4b5563",fontSize:13}}>
        <div style={{fontSize:32,marginBottom:12}}>📋</div>
        <div style={{fontWeight:600,marginBottom:6,color:"#6b7280"}}>No bills yet</div>
        <div>Tap + Add Bill to get started</div>
      </div>}
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        {[...bills].sort((a,b)=>a.dueDay-b.dueDay).map(bill=>(
          <div key={bill.id} style={{background:bill.active?"#1a1f2e":"#111318",border:`1px solid ${bill.active?"#1e2230":"#16181f"}`,borderRadius:9,padding:"8px 11px",display:"flex",alignItems:"center",gap:8,opacity:bill.active?1:0.35}}>
            <button onClick={()=>onToggle(bill.id)} style={{width:22,height:22,borderRadius:5,flexShrink:0,background:bill.active?"#22c55e":"#2a2f3e",border:`2px solid ${bill.active?"#16a34a":"#3f4659"}`,cursor:"pointer",color:"#fff",fontSize:12}}>{bill.active?"✓":""}</button>
            <div style={{width:22,textAlign:"center",background:"#2a2f3e",borderRadius:3,padding:"2px 3px",fontSize:10,color:"#6b7280",flexShrink:0}}>{bill.dueDay}</div>
            <div style={{flex:1,fontSize:13,fontWeight:500}}>{bill.name}</div>
            <div style={{display:"flex",gap:5,fontSize:10}}>
              {bill.autopay&&<span style={{color:accent}}>Auto</span>}
              {bill.lateFee&&<span style={{color:"#f59e0b"}}>Late Fee</span>}
            </div>
            <div style={{fontWeight:700,fontSize:12,color:"#8b92a5",minWidth:58,textAlign:"right"}}>{parseFloat(bill.amount)>0?fmt(parseFloat(bill.amount)):"—"}</div>
            {conf===bill.id
              ?<div style={{display:"flex",gap:4}}>
                  <button onClick={()=>{onDelete(bill.id);setConf(null);}} style={{background:"#ef4444",border:"none",color:"#fff",borderRadius:5,padding:"3px 8px",fontSize:11,cursor:"pointer"}}>Del</button>
                  <button onClick={()=>setConf(null)} style={{background:"#2a2f3e",border:"none",color:"#9ca3af",borderRadius:5,padding:"3px 8px",fontSize:11,cursor:"pointer"}}>×</button>
                </div>
              :<button onClick={()=>setConf(bill.id)} style={{background:"none",border:"none",color:"#6b7280",fontSize:16,padding:"2px 4px",cursor:"pointer"}}>×</button>
            }
          </div>
        ))}
      </div>
    </div>
  );
}

function TrackerApp({user,onSignOut}){
  const [periods,setPeriods]=useState([
    {id:"period1",paycheckDate:"Set your pay date",bills:[]},
    {id:"period2",paycheckDate:"Set your pay date",bills:[]},
    {id:"period3",paycheckDate:"Bonus month",bills:[]}
  ]);
  const [paycheck,setPaycheck]=useState({period1:"",period2:"",period3:""});
  const [activePid,setActivePid]=useState("period1");
  const [view,setView]=useState("tracker");
  const [editingId,setEditingId]=useState(null);
  const [newBill,setNewBill]=useState({name:"",dueDay:"",amount:"",autopay:false,lateFee:false});
  const [showAdd,setShowAdd]=useState(false);
  const [billFilter,setBillFilter]=useState("all");
  const [history,setHistory]=useState([]);
  const [showHist,setShowHist]=useState(false);
  const [lastSaved,setLastSaved]=useState(null);
  const [syncStatus,setSyncStatus]=useState("idle");
  const [ready,setReady]=useState(false);

  const uid=user.uid;

  useEffect(()=>{
    (async()=>{
      try{
        const d=await fbLoad(uid);
        if(d){
          if(d.periods)setPeriods(d.periods);
          if(d.paycheck)setPaycheck(d.paycheck);
          if(d.activePid)setActivePid(d.activePid);
          if(d.history)setHistory(d.history||[]);
        }
      }catch(e){console.error(e);}
      setReady(true);
    })();
  },[uid]);

  const persist=useCallback((p,pc,ap,hist)=>{
    const data={periods:p,paycheck:pc,activePid:ap,history:hist||[],savedAt:new Date().toISOString()};
    setSyncStatus("syncing");
    fbSave(uid,data).then(ok=>{setSyncStatus(ok?"ok":"error");setTimeout(()=>setSyncStatus("idle"),3000);});
    setLastSaved(new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}));
  },[uid]);

  const isSB=activePid==="snowball";
  const period=periods.find(p=>p.id===activePid)||periods[0];
  const col=PC[activePid]||PC.period1;
  const aBills=isSB?[]:[...(period.bills||[])].filter(b=>b.active).sort((a,b)=>a.dueDay-b.dueDay);
  const pcNum=parseFloat(paycheck[activePid])||0;
  const totBills=aBills.reduce((s,b)=>s+(parseFloat(b.amount)||0),0);
  const paidAmt=aBills.filter(b=>b.paid).reduce((s,b)=>s+(parseFloat(b.amount)||0),0);
  const paidCt=aBills.filter(b=>b.paid).length;
  const remaining=pcNum-totBills;
  const pct=pcNum>0?Math.round((totBills/pcNum)*100):0;
  const alerts=aBills.filter(b=>b.lateFee&&!b.autopay&&!b.paid);

  const mutP=nb=>{const next=periods.map(p=>p.id===activePid?{...p,bills:nb}:p);setPeriods(next);persist(next,paycheck,activePid,history);};
  const togglePaid=id=>mutP((period.bills||[]).map(b=>b.id===id?{...b,paid:!b.paid}:b));
  const updAmt=(id,v)=>mutP((period.bills||[]).map(b=>b.id===id?{...b,amount:v}:b));
  const updDay=(id,d)=>mutP((period.bills||[]).map(b=>b.id===id?{...b,dueDay:d}:b));
  const togOn=id=>mutP((period.bills||[]).map(b=>b.id===id?{...b,active:!b.active}:b));
  const addBill=()=>{if(!newBill.name.trim())return;mutP([...(period.bills||[]),{...newBill,id:Date.now(),active:true,paid:false}]);setNewBill({name:"",dueDay:"",amount:"",autopay:false,lateFee:false});setShowAdd(false);};
  const closePeriod=()=>{
    const snap={period:col.label,date:new Date().toLocaleDateString(),paycheck:pcNum,totalBills:totBills,remaining};
    const h=[...history,snap];setHistory(h);
    const rb=(period.bills||[]).map(b=>({...b,paid:false}));
    const next=periods.map(p=>p.id===activePid?{...p,bills:rb}:p);
    setPeriods(next);persist(next,paycheck,activePid,h);
  };
  const setPC=v=>{const pc={...paycheck,[activePid]:v};setPaycheck(pc);persist(periods,pc,activePid,history);};
  const swP=id=>{setActivePid(id);setEditingId(null);persist(periods,paycheck,id,history);};

  const displayName=user.displayName||user.email||"User";
  const initials=displayName.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const syncColors={idle:"#4b5563",syncing:"#f59e0b",ok:"#22c55e",error:"#ef4444"};

  if(!ready)return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"60vh",color:"#6b7280",fontFamily:"'Inter',sans-serif"}}>Loading your data…</div>;

  const TABS=[...periods.map(p=>({id:p.id})),{id:"snowball"}];

  return (
    <div style={{fontFamily:"'Inter','Segoe UI',sans-serif",background:"#0f1117",minHeight:"100vh",color:"#e8eaf0"}}>
      {/* Header */}
      <div style={{background:"#13161f",borderBottom:"1px solid #1e2230",padding:"12px 16px",position:"sticky",top:0,zIndex:50}}>
        <div style={{maxWidth:680,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{fontSize:16,fontWeight:800,background:"linear-gradient(135deg,#6366f1,#818cf8)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",letterSpacing:"-0.5px"}}>PayPeriod Pro</div>
            <div style={{fontSize:11,color:syncColors[syncStatus],padding:"2px 8px",background:"#1a1f2e",borderRadius:20,border:"1px solid #1e2230"}}>
              {syncStatus==="syncing"?"⟳ Saving…":syncStatus==="ok"?"✓ Synced":syncStatus==="error"?"! Error":"●"}
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            {!isSB&&<>
              <button onClick={()=>setView("tracker")} style={{background:view==="tracker"?col.accent:"transparent",color:view==="tracker"?"#fff":"#9ca3af",border:`1px solid ${view==="tracker"?col.accent:"#2a2f3e"}`,borderRadius:7,padding:"6px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Tracker</button>
              <button onClick={()=>setView("manage")} style={{background:view==="manage"?col.accent:"transparent",color:view==="manage"?"#fff":"#9ca3af",border:`1px solid ${view==="manage"?col.accent:"#2a2f3e"}`,borderRadius:7,padding:"6px 12px",fontSize:12,fontWeight:600,cursor:"pointer"}}>Manage</button>
            </>}
            <div style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#4f46e5)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:700,color:"#fff",flexShrink:0}}>{initials}</div>
            <button onClick={onSignOut} style={{fontSize:12,color:"#6b7280",background:"none",border:"1px solid #2a2f3e",borderRadius:6,padding:"4px 10px",cursor:"pointer"}}>Sign out</button>
          </div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{background:"#13161f",borderBottom:"1px solid #1e2230"}}>
        <div style={{maxWidth:680,margin:"0 auto",display:"flex"}}>
          {TABS.map(t=>{
            const c=PC[t.id]||PC.period1,on=t.id===activePid;
            const sub=t.id==="snowball"?"Debt tracker":(periods.find(p=>p.id===t.id)||{}).paycheckDate||"";
            return <button key={t.id} onClick={()=>swP(t.id)} style={{flex:1,padding:"9px 3px 11px",background:on?"#0f1117":"transparent",border:"none",borderTop:`3px solid ${on?c.accent:"transparent"}`,borderBottom:on?"1px solid #0f1117":"1px solid #1e2230",color:on?c.accent:"#6b7280",fontWeight:on?700:500,fontSize:11,cursor:"pointer",lineHeight:1.3}}>
              <div>{c.label}</div>
              <div style={{fontSize:9,opacity:0.65,fontWeight:400,marginTop:1}}>{sub}</div>
            </button>;
          })}
        </div>
      </div>

      {/* Body */}
      <div style={{maxWidth:680,margin:"0 auto",padding:"14px 16px 90px"}}>
        {isSB
          ?<div style={{textAlign:"center",padding:"60px 20px",color:"#4b5563"}}>
              <div style={{fontSize:40,marginBottom:12}}>❄️</div>
              <div style={{fontWeight:700,fontSize:16,color:"#6b7280",marginBottom:8}}>Snowball Debt Tracker</div>
              <div style={{fontSize:13,lineHeight:1.6}}>Coming soon — track your credit cards,<br/>set payoff targets, and crush your debt.</div>
            </div>
          :<>
            {/* Welcome for new users */}
            {(period.bills||[]).length===0&&view==="tracker"&&<div style={{background:"linear-gradient(135deg,#6366f122,#818cf811)",border:"1px solid #6366f133",borderRadius:12,padding:20,marginBottom:16,textAlign:"center"}}>
              <div style={{fontSize:28,marginBottom:8}}>👋</div>
              <div style={{fontWeight:700,fontSize:16,color:"#f0f2f8",marginBottom:6}}>Welcome, {user.displayName||"there"}!</div>
              <div style={{fontSize:13,color:"#6b7280",marginBottom:16}}>Start by adding your bills in the Manage tab, then enter your paycheck amount below.</div>
              <button onClick={()=>setView("manage")} style={{background:"linear-gradient(135deg,#6366f1,#4f46e5)",color:"#fff",border:"none",borderRadius:9,padding:"10px 24px",fontWeight:700,fontSize:14,cursor:"pointer"}}>Set Up My Bills →</button>
            </div>}

            {/* Paycheck inputs */}
            <div style={{display:"flex",gap:10,marginBottom:12}}>
              <div style={{flex:1}}>
                <label style={S.lbl}>Paycheck Amount</label>
                <div style={{position:"relative"}}>
                  <span style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#6b7280",fontSize:13}}>$</span>
                  <input value={paycheck[activePid]} onChange={e=>setPC(e.target.value)} style={{...S.inp,paddingLeft:24}} type="number" step="0.01" placeholder="0.00"/>
                </div>
              </div>
              <div style={{flex:1}}>
                <label style={S.lbl}>Pay Date</label>
                <input value={period.paycheckDate} onChange={e=>{const next=periods.map(p=>p.id===activePid?{...p,paycheckDate:e.target.value}:p);setPeriods(next);persist(next,paycheck,activePid,history);}} style={S.inp} placeholder="e.g. Jun 26"/>
              </div>
            </div>

            {/* Summary cards */}
            {pcNum>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:12}}>
              <Card label="Total Bills" value={fmt(totBills)} sub={pct+"% of check"} color="#ef4444"/>
              <Card label="Still Owed" value={fmt(totBills-paidAmt)} sub={(aBills.length-paidCt)+" unpaid"} color="#f59e0b"/>
              <Card label="Transfer Out" value={fmt(remaining)} sub="to personal acct" color={remaining>=0?"#22c55e":"#ef4444"}/>
            </div>}

            {/* Progress */}
            {aBills.length>0&&<div style={{background:"#1a1f2e",borderRadius:8,padding:"9px 13px",marginBottom:12,border:"1px solid #1e2230"}}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#8b92a5",marginBottom:5}}>
                <span>Paid this period</span>
                <span>{paidCt}/{aBills.length} · {fmt(paidAmt)} of {fmt(totBills)}</span>
              </div>
              <div style={{background:"#2a2f3e",borderRadius:4,height:6}}>
                <div style={{width:(aBills.length?paidCt/aBills.length*100:0)+"%",height:"100%",background:`linear-gradient(90deg,${col.accent},${col.dark})`,borderRadius:4,transition:"width 0.3s"}}/>
              </div>
            </div>}

            {alerts.length>0&&view==="tracker"&&<div style={{background:"#3b1500",border:"1px solid #92400e",borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:12,color:"#fcd34d"}}>
              <strong>⚠️ Manual payment needed: </strong>{alerts.map(b=>b.name).join(" · ")}
            </div>}

            {view==="tracker"&&<>
              {aBills.length>0&&<div style={{display:"flex",gap:6,marginBottom:10,alignItems:"center"}}>
                <span style={{fontSize:11,color:"#6b7280",marginRight:2}}>Show:</span>
                {[{k:"all",l:"All"},{k:"auto",l:"⚡ Auto"},{k:"manual",l:"✋ Manual"}].map(f=>
                  <button key={f.k} onClick={()=>setBillFilter(f.k)} style={{padding:"5px 11px",borderRadius:20,fontSize:12,fontWeight:600,cursor:"pointer",border:"none",background:billFilter===f.k?col.accent:"#1a1f2e",color:billFilter===f.k?"#fff":"#6b7280",outline:`2px solid ${billFilter===f.k?col.accent:"#1e2230"}`}}>{f.l}</button>
                )}
                <button onClick={()=>setShowHist(!showHist)} style={{fontSize:11,color:col.accent,background:"none",border:"none",cursor:"pointer",padding:0,marginLeft:"auto"}}>{showHist?"Hide history":"History"}</button>
              </div>}

              {showHist&&history.length>0&&<div style={{background:"#1a1f2e",borderRadius:8,border:"1px solid #1e2230",padding:"10px 12px",marginBottom:12}}>
                <div style={{fontSize:10,color:"#6b7280",textTransform:"uppercase",letterSpacing:1,marginBottom:7}}>Closed Periods</div>
                {[...history].reverse().map((hh,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:i<history.length-1?"1px solid #1e2230":"none",fontSize:12}}>
                  <span style={{color:"#9ca3af"}}>{hh.period} <span style={{color:"#6b7280"}}>({hh.date})</span></span>
                  <span style={{color:"#22c55e",fontWeight:600}}>{fmt(hh.remaining)} transferred</span>
                </div>)}
              </div>}

              <div style={{display:"flex",flexDirection:"column",gap:5}}>
                {aBills.filter(b=>billFilter==="all"?true:billFilter==="auto"?b.autopay:!b.autopay).map(bill=>
                  <BillRow key={bill.id} bill={bill} onTogglePaid={()=>togglePaid(bill.id)} onAmt={v=>updAmt(bill.id,v)} onDayChange={d=>updDay(bill.id,d)} editingId={editingId} setEditingId={setEditingId} accent={col.accent}/>
                )}
              </div>

              {lastSaved&&<div style={{marginTop:12,textAlign:"center",fontSize:11,color:"#22c55e"}}>✓ Saved at {lastSaved} — synced across all your devices</div>}

              {aBills.length>0&&<div style={{marginTop:10,background:"#1a1f2e",border:"1px solid #2a2f3e",borderRadius:10,padding:"12px 14px"}}>
                <div style={{fontSize:12,color:"#9ca3af",marginBottom:4,fontWeight:600}}>Start Next Pay Cycle</div>
                <div style={{fontSize:11,color:"#6b7280",marginBottom:10,lineHeight:1.5}}>Clears paid checkmarks and advances dates. Amounts and history are kept.</div>
                <ResetButton onConfirm={closePeriod} label={col.label} accent={col.accent} dark={col.dark}/>
              </div>}
            </>}

            {view==="manage"&&<ManageBills bills={period.bills||[]} onToggle={togOn} onAdd={addBill} newBill={newBill} setNewBill={setNewBill} showAdd={showAdd} setShowAdd={setShowAdd} accent={col.accent} periodLabel={col.label} onDelete={id=>mutP((period.bills||[]).filter(b=>b.id!==id))}/>}
          </>
        }
      </div>
    </div>
  );
}

// ── ROOT ──────────────────────────────────────────────────────────────────────
function Root(){
  const [screen,setScreen]=useState("landing");
  const [user,setUser]=useState(null);

  const goToAuth=async(mode)=>{
    try{
      await initFirebase();
      _auth.onAuthStateChanged(u=>{
        if(u){setUser(u);setScreen("app");}
      });
    }catch(e){console.error(e);}
    setScreen(mode);
  };

  const handleSignOut=async()=>{
    if(_auth) await _auth.signOut();
    setUser(null);
    setScreen("landing");
  };

  if(screen==="app"&&user) return <TrackerApp user={user} onSignOut={handleSignOut}/>;
  if(screen==="signin"||screen==="signup") return <AuthScreen mode={screen} onToggle={()=>setScreen(screen==="signin"?"signup":"signin")} onSuccess={()=>setScreen("app")} onBack={()=>setScreen("landing")}/>;
  return <Landing onSignUp={()=>goToAuth("signup")} onSignIn={()=>goToAuth("signin")}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Root));
</script>
</body>
</html>
